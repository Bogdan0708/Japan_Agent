name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-tests:
    name: Safety tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run zero-network safety suite
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -v

      - name: Validate shell wrappers
        run: bash -n scripts/daily.sh scripts/weekly.sh

      - name: Check whitespace errors
        run: git diff --check

  research-sdk:
    name: Research SDK adapter (Python 3.11, predict extra)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the predict extra
        run: python -m pip install ".[predict]"

      - name: Run the SDK adapter tests against the real SDK option names
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest tests.predict.test_research_sdk -v
